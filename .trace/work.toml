[work."WORK-rank-edge-ontology-c-o-n-t-a-i-n-s-p-a-r-t-i-c-i-p-a-t-e-s-i-n-h-a-n-d-l-e-s-d-e-f-i-n-e-s-enter-the-p-p-r-adjacency"]
title = "Rank-edge ontology: CONTAINS/PARTICIPATES_IN/HANDLES/DEFINES enter the PPR adjacency"
status = "active"
origin.source = "behavior-change"
origin.intent = "Heterogeneous rankable nodes exist but membership/participation/invocation/definition predicates never enter the PageRank adjacency, leaving components/flows/routes/schemas disconnected from the rank graph. Add an explicit RankEdgeKind ontology (distinct from reference_kind) so CONTAINS (container->member 0.4, member->container ranking transition 0.8), PARTICIPATES_IN (symbol->flow 0.6, flow->participant 1.2), HANDLES (symbol->route 1.5), and DEFINES (symbol->schema 1.2) feed PPR with deliberate direction and weight."
origin.session = "default"
