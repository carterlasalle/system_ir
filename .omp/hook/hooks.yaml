# TraceLayer × Oh My Pi — YAML hooks (pi-yaml-hooks)
#
# ⚠️ INACTIVE — DO NOT TRUST THIS FILE.
#
# This YAML hook file is INERT in the current OMP runtime: the
# pi-yaml-hooks plugin that interprets it is NOT installed, and the OMP
# runtime does not natively read `.omp/hook/hooks.yaml`. It is retained
# only as a historical reference.
#
# All TraceLayer lifecycle behavior is implemented by the NATIVE extension
# at `.omp/extensions/tracelayer/trace-gate.ts`, which registers:
#   session_start      → trace hook session-start
#   before_agent_start → trace hook prompt-context
#   tool_call          → pre-mutation gate (edit/write)
#   tool_result        → post-mutation coaching (edit/write/bash/patch)
#   session_stop       → fail-closed completion gate
# The extension is the single source of truth; this YAML is NOT loaded.
#
# To remove it entirely: delete this file. It is kept only so the layout
# is not mistaken for active configuration.
hooks:
  - event: session.created
    actions:
      - bash: uv run trace hook session-start --format json
  - event: user.prompt.submit
    actions:
      - bash: uv run trace hook prompt-context --format json
  - event: tool.after.edit
    actions:
      - bash: uv run trace hook post-mutation --format json
  - event: tool.after.write
    actions:
      - bash: uv run trace hook post-mutation --format json
  - event: file.changed
    actions:
      - bash: uv run trace index --changed
  - event: session.stop
    actions:
      - bash: uv run trace hook session-stop --format json
