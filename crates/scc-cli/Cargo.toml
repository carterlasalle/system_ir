[package]
name = "scc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System Context Compiler CLI, daemon, MCP server, and Claude Code plugin"

[[bin]]
name = "scc"
path = "src/main.rs"

[dependencies]
scc-core.workspace = true
scc-store.workspace = true
scc-indexer.workspace = true
scc-graph.workspace = true
scc-context.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tiny_http = "0.12"
notify = "6"
libc = "0.2"
tempfile = "3"
chrono.workspace = true

[dev-dependencies]
jsonschema = "0.26"
