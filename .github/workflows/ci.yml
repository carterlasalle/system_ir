# trace:exempt reason=infra-config  # CI workflow declaration, not repo behavior; the jobs' behavior is traced at the source modules they run
name: CI
on:
  # PR branches only run pull_request. Running both push and pull_request on
  # the same SHA attaches two `test` checks; a flake on one leaves the PR
  # UNSTABLE even when the other is green.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # HERMETIC ORDER: the SDK tests shell out to target/debug/scc, so the
      # build MUST come first — a warm cache must never be what makes CI
      # green on a cold runner.
      - name: Build
        run: cargo build --workspace
      - name: Clippy (deny warnings, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # uv for Python tooling (the pinned TraceLayer install below and the
      # SDK/benchmark steps) — installed hermetically via the official
      # setup action, no pip.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python SDK tests
        run: |
          cd sdk/python && SCC_BIN=$PWD/../../target/debug/scc uv run python -m unittest test_scc_sdk.py
      - name: TypeScript SDK build + tests
        run: |
          cd sdk/typescript
          npm install --no-audit --no-fund
          npm run build
          SCC_BIN=$PWD/../../target/debug/scc npm test
      # Benchmark regression + evaluator meta-contract tests (§25/§29/§36):
      # the four-way contract (untouched/comment-only/wrong FAIL,
      # known-good PASS) must hold for EVERY evaluator before any agent
      # experiment can be trusted; CI enforces it on every push.
      # Benchmark regression + evaluator meta-contract tests: the
      # four-way contract (untouched/comment-only/wrong FAIL, known-good
      # PASS) must hold for EVERY evaluator before any agent experiment
      # can be trusted; CI enforces it on every push. Both evaluator
      # suites run (external/ registry + evaluators/ contract).
      - name: Benchmark harness + adapter self-tests (no network)
        run: |
          (cd benchmarks/external && SCC_BIN=$PWD/../../target/debug/scc uv run python -m unittest test_harness.py test_aider_fairness.py test_evaluators.py test_write_protocol.py)
          uv run python benchmarks/evaluators/test_contract.py
      - name: OMP setup + generated-extension smoke
        run: |
          python3 scripts/omp_smoke.py
      - name: Test
        run: |
          # resolution-in-the-bench tests need the semantic backends
          # (behavior_resolve drives tsserver through
          # typescript-language-server); pyright is bundled via npm too.
          npm install -g typescript-language-server typescript pyright
          # Skip the 50k wall-clock gate here. Debug+test profile indexes
          # this fixture in 80–120s (over the 90s envelope); `--release`
          # is the honest bound. Compiling release in this job was ~2.5 min
          # for a ~12s index, then bench-250k compiled release again.
          # The gate runs in bench-250k against that one release build.
          # Golden tests live only in tests/golden.rs (helpers: tests/common/).
          cargo test --workspace -- --skip cold_index_50k_loc_under_30s
      # HERMETIC TraceLayer: pinned version via uv — no unpinned pip, no
      # continue-on-error. The gate fails CI when verification fails.
      - name: Install TraceLayer (pinned)
        run: uv tool install tracelayer==0.2.40
      - name: Trace policy gate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v trace >/dev/null 2>&1; then
            echo "TraceLayer CLI not on PATH after uv tool install" >&2
            exit 1
          fi
          trace verify --changed
      - name: Context benchmark gate
        run: cargo run -p scc-cli --bin scc -- bench context --min-recall 0.9
      - name: Hermes plugin contract test
        run: |
          python3 -m py_compile plugins/hermes/scc/__init__.py plugins/hermes/scc/schemas.py plugins/hermes/scc/tools.py
          SCC_BIN=$PWD/target/debug/scc python3 plugins/hermes/test_plugin.py
      - name: SBOM (dependency inventory)
        run: |
          cargo tree --edges normal --format '{p}' > sbom-deps.txt
          wc -l sbom-deps.txt
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-deps.txt

  bench-250k:
    runs-on: ubuntu-latest
    # Independent of `test`: a green PR used to wait for the full test job
    # and then pay for another release compile plus the 250k index.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p scc-cli
      - name: 50k LOC cold-index gate (release)
        run: cargo test -p scc-cli --release --test perf cold_index_50k_loc_under_30s -- --test-threads=1 --nocapture
      - name: 250k LOC benchmark
        run: ./target/release/scc bench index --files 1000 --lines 250
