name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Context benchmark gate
        run: cargo run -p scc-cli --bin scc -- bench context --min-recall 0.9
      - name: Hermes plugin contract test
        run: |
          python3 -m py_compile plugins/hermes/scc/__init__.py plugins/hermes/scc/schemas.py plugins/hermes/scc/tools.py
          SCC_BIN=$PWD/target/debug/scc python3 plugins/hermes/test_plugin.py
      - name: SBOM (dependency inventory)
        run: |
          cargo tree --edges normal --format '{p} {v}' > sbom-deps.txt
          sha256sum target/release/scc > scc.sha256 || true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-deps.txt

  bench-250k:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p scc-cli
      - name: 250k LOC benchmark
        run: ./target/release/scc bench index --files 1000 --lines 250
