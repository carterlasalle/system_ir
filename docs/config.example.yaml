schema: 1
index:
  ignore:
    - vendor/**
    - generated/**
    - node_modules/**
    - .git/**
  watch: true
languages:
  typescript: true
  python: true
  go: false
  rust: false
context:
  startup_tokens: 6000
  task_tokens: 10000
  include_low_confidence_inference: false
inference:
  enabled: false
  provider: local        # local = ollama at http://127.0.0.1:11434/v1; also: openai | endpoint
  embedding_model: nomic-embed-text
  rerank_model: ""       # optional separate /rerank model (Cohere/Jina style)
  base_url: ""           # override endpoint (e.g. https://gateway.example/v1)
  api_key_env: ""        # env var holding the key (never stored)
runtime:
  opentelemetry:
    enabled: false
integrations:
  serena: true
  beads: false
  hindsight: false
  gitnexus: false
  narsil: false
security:
  redact_secrets: true
  allow_remote_models: false
  listen: 127.0.0.1:7777
