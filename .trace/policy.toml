# TraceLayer policy (spec Section 24.4).
profile = "standard"

[lifecycle]
default = "wip"
ci = "merge"

[requirements.merge]
require_work_ancestry = true
require_requirement_for_changed_behavior = true
require_verifying_test = true
require_test_pass = true
require_coverage_confirmation = false
block_stale = true

[requirements.release]
require_coverage_confirmation = true
require_semantic_audit = true

[exclusions]
paths = [
  "Cargo.lock",
  "crates/scc-indexer/src/adapters.rs",
  "vendor/**",
  "generated/**",
  "docs/vendor/**",
  "benchmarks/blind-lock.json",
  "fixtures/**",
  "benchmarks/external-lock.json",
  "benchmarks/external/**",
  "benchmarks/evaluators/**",
  "benchmarks/results/**",
  "benchmarks/tasks.json",
  ".omp/**",
  ".pi/**",
  ".agents/**",
  ".hermes/**",
  ".trace/**",
  "sdk/typescript/src/test/**",
  ".DS_Store",
  "**/.DS_Store",
  "**/__pycache__/**",
  "*.pyc",
  "plugins/hermes/**/__pycache__/**",
  "crates/scc-indexer/src/lib.rs",
  "crates/scc-indexer/src/model.rs",
  "crates/scc-indexer/src/resolve.rs",
  "plugins/hermes/scc/schemas.py",
  ".github/**",
  ".DS_Store",
  "crates/.DS_Store",
  "plugins/.DS_Store",
  "plugins/omp/**",
  ".gitignore",
  "CHANGELOG.md",
  "README.md",
  "benchmarks/tasks.json",
  "docs/MISSION_FINAL_REPORT.md",
  "sdk/python/scc_sdk.egg-info/**",
  "sdk/python/uv.lock",
  "crates/scc-cli/tests/adapters.rs",
  "crates/scc-cli/tests/behavior_generalize.rs",
  "crates/scc-cli/tests/behavior_resolve.rs",
  "crates/scc-cli/tests/benchatlas.rs",
  "crates/scc-cli/tests/benchctx.rs",
  "crates/scc-cli/tests/cfg_causal.rs",
  "crates/scc-cli/tests/cli_surface.rs",
  "crates/scc-cli/tests/clustering.rs",
  "crates/scc-cli/tests/command_components.rs",
  "crates/scc-cli/tests/compiler_gaps.rs",
  "crates/scc-cli/tests/contract_ontology.rs",
  "crates/scc-cli/tests/coverage_contracts.rs",
  "crates/scc-cli/tests/embeddings.rs",
  "crates/scc-cli/tests/fact_generalize.rs",
  "crates/scc-cli/tests/facts_go.rs",
  "crates/scc-cli/tests/facts_java.rs",
  "crates/scc-cli/tests/facts_python.rs",
  "crates/scc-cli/tests/facts_rust.rs",
