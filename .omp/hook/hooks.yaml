#
# ⚠️ INACTIVE — DO NOT TRUST THIS FILE.
#
# This YAML hook file is INERT in the current OMP runtime: no YAML hook
# loader exists in OMP 18.x (verified against the 18.0.11 binary — the
# ambient hooks scan accepts only `.ts`/`.js` files, plugin manifest
# loading reads `extensions` arrays only, and no `pi-yaml-hooks` plugin
# is installed). It is retained only as a historical reference for
# runtimes that DID support this layout.
#
# All TraceLayer lifecycle behavior is implemented by the NATIVE extension
# at `.omp/extensions/tracelayer/trace-gate.ts`, which registers the
# `tool_call` pre-mutation gate, `tool_result` post-edit coaching, and the
# fail-closed `session_stop` completion gate via OMP's native extension
# events. The extension is the single source of truth; this YAML is
# NOT loaded.
#
# To remove it entirely: delete this file. It is kept only so the layout
# is not mistaken for active configuration.
hooks:
  - event: session.created
    actions:
      - bash: uv run trace hook session-start --format json
  - event: user.prompt.submit
    actions:
      - bash: uv run trace hook prompt-context --format json
  - event: tool.after.edit
    actions:
      - bash: uv run trace hook post-mutation --format json
  - event: tool.after.write
    actions:
      - bash: uv run trace hook post-mutation --format json
  - event: file.changed
    actions:
      - bash: uv run trace index --changed
